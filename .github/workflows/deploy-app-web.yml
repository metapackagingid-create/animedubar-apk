name: Deploy Live Auto-Update Pelanggan (GitHub Pages OTA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-animedubar-app"
  cancel-in-progress: false

jobs:
  deploy-live-ota:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Inject Secrets ke Live App (Auto-Update Tanpa Instal Ulang APK)
        env:
          BACKEND_WEBAPP_URL: ${{ secrets.BACKEND_WEBAPP_URL }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          LIVE_APP_URL: ${{ secrets.LIVE_APP_URL }}
        run: node scripts/configure-android.mjs

      - name: 4. Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 5. Upload Folder www/ (Live OTA)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: 6. Deploy ke GitHub Pages (APK Langsung Auto-Update!)
        id: deployment
        uses: actions/deploy-pages@v4
